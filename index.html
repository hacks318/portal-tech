<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal Tech</title>

    <style>
        /* APENAS FUNDO TECNOLÓGICO */
        body {
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;

            background:
                linear-gradient(rgba(0, 255, 100, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 100, 0.05) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(0, 255, 100, 0.12), transparent 60%),
                #0d1117;

            background-size: 40px 40px, 40px 40px, auto, auto;

            animation: fundo 10s linear infinite;
        }

        @keyframes fundo {
            from {
                background-position: 0 0, 0 0, center, center;
            }

            to {
                background-position: 40px 40px, 40px 40px, center, center;
            }
        }
    </style>
</head>
